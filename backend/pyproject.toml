[project]
name = "lantern"
version = "0.1.0"
description = "Hands-free Thai smart-home voice assistant backend"
readme = { text = "Lantern hands-free smart-home voice assistant backend", content-type = "text/plain" }
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "openai>=1.68,<2",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "sounddevice>=0.5.1,<1",
    "uvicorn>=0.34,<1",
    "webrtcvad-wheels>=2.0.14,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
