<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="LANTERN — โคมไฟอัจฉริยะสั่งการด้วยเสียง">
  <defs>
    <radialGradient id="room" cx="78%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFC75A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFC75A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE7A8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFC75A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFC75A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="#2C3A42"/>
  <rect width="1280" height="400" fill="url(#room)"/>

  <!-- wire colours strip -->
  <rect x="0" y="388" width="427" height="12" fill="#8B4A26"/>
  <rect x="427" y="388" width="427" height="12" fill="#2E6DB4"/>
  <rect x="854" y="388" width="426" height="12" fill="#7FA328"/>

  <text x="96" y="122" fill="#9FB0BA" font-family="'Bai Jamjuree','Segoe UI',Tahoma,sans-serif" font-size="26" font-weight="500">Physical Computing Project</text>
  <text x="90" y="250" fill="#FFE7A8" filter="url(#glow)" font-family="'Bai Jamjuree','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="150" font-weight="700" letter-spacing="8">LANTERN</text>
  <text x="96" y="312" fill="#D5DEE3" font-family="'Anuphan','Leelawadee UI','Thonburi',Tahoma,sans-serif" font-size="34">โคมไฟอัจฉริยะ สั่งเปิด-ปิดด้วยเสียง</text>

  <!-- bulb -->
  <g transform="translate(900 0) scale(1.15)">
    <line x1="100" y1="0" x2="100" y2="58" stroke="#8B4A26" stroke-width="4"/>
    <circle cx="100" cy="170" r="140" fill="url(#halo)"/>
    <rect x="82" y="56" width="36" height="42" rx="4" fill="#5E6A71"/>
    <line x1="82" y1="68" x2="118" y2="68" stroke="#3E474D" stroke-width="2"/>
    <line x1="82" y1="78" x2="118" y2="78" stroke="#3E474D" stroke-width="2"/>
    <line x1="82" y1="88" x2="118" y2="88" stroke="#3E474D" stroke-width="2"/>
    <path d="M86 98 C86 120 50 132 50 175 a50 50 0 0 0 100 0 C150 132 114 120 114 98 Z" fill="#FFDC8C" stroke="#FFE7A8" stroke-width="2.5"/>
    <path d="M92 100 L92 150 M108 100 L108 150 M92 150 q4 -10 8 0 q4 10 8 0" fill="none" stroke="#FFF6D9" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- voice waves -->
  <g fill="none" stroke="#FFE7A8" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M1180 160 q22 40 0 80"/>
    <path d="M1205 140 q34 60 0 120" opacity="0.6"/>
    <path d="M1230 120 q46 80 0 160" opacity="0.35"/>
  </g>
</svg>
